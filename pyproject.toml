[project]
name = "harness-creator"
dynamic = ["version"]
description = "Plugin do Claude Code que cria, avalia e compila governança de harness (permissions/hooks/AGENTS.md nativos) — Agente = Modelo + Harness"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.urls]
repository = "https://github.com/dseto/harness-creator"
documentation = "https://github.com/dseto/harness-creator/blob/main/README.md"
issues = "https://github.com/dseto/harness-creator/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A suíte testa a ÁRVORE DE TRABALHO, não o wheel instalado. Sem isto, num
# ambiente onde `harness-creator` foi instalado de forma não-editável, o
# `import harness` dos testes resolve para site-packages e a suíte passa
# verde sobre código que não é o que está sendo editado — falso-verde
# silencioso, sem nenhum sinal na saída do pytest.
pythonpath = ["src"]
